<title>Strata Shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<style>
/* Tokens: Strata Design System (Catppuccin). Dark-first. */
:root{
  --mauve:#c6a0f6;--red:#ed8796;--peach:#f5a97f;--yellow:#eed49f;--green:#a6da95;--teal:#8bd5ca;
  --sky:#91d7e3;--blue:#8aadf4;--lavender:#b7bdf8;
  --text:#cad3f5;--sub1:#b8c0e0;--sub0:#a5adcb;--ov2:#939ab7;--ov1:#8087a2;--ov0:#6e738d;
  --s2:#5b6078;--s1:#494d64;--s0:#363a4f;--base:#24273a;--mantle:#1e2030;--crust:#181926;
  --bg:var(--base);--fg:var(--text);--muted:var(--sub0);--border:var(--s0);--surface:var(--s0);--surface-h:var(--s1);
  --panel:var(--mantle);--node:var(--mantle);--code:var(--crust);--primary:var(--mauve);--on-primary:var(--crust);
  --grid:var(--s1);
  --layer-bronze:var(--peach);--layer-silver:var(--sub0);--layer-gold:var(--yellow);
  --rel-fk:var(--blue);--rel-lin:var(--mauve);--key-pk:var(--green);--key-fk:var(--blue);--pin:var(--mauve);
  --shadow:0 4px 10px -2px rgb(0 0 0/.45);--shadow-lg:0 18px 40px -12px rgb(0 0 0/.6);
  --sans:Inter,ui-sans-serif,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --mauve:#8839ef;--red:#d20f39;--peach:#fe640b;--yellow:#df8e1d;--green:#40a02b;--teal:#179299;--sky:#04a5e5;--blue:#1e66f5;--lavender:#7287fd;
  --text:#4c4f69;--sub1:#5c5f77;--sub0:#6c6f85;--ov2:#7c7f93;--ov1:#8c8fa1;--ov0:#9ca0b0;--s2:#acb0be;--s1:#bcc0cc;--s0:#ccd0da;
  --base:#eff1f5;--mantle:#e6e9ef;--crust:#dce0e8;--node:#ffffff;--code:#f6f7fa;--on-primary:#ffffff;--layer-silver:var(--lavender);
  --shadow:0 4px 10px -3px rgb(76 79 105/.18);--shadow-lg:0 18px 40px -12px rgb(76 79 105/.3);
}}
:root[data-theme="light"]{
  --mauve:#8839ef;--red:#d20f39;--peach:#fe640b;--yellow:#df8e1d;--green:#40a02b;--teal:#179299;--sky:#04a5e5;--blue:#1e66f5;--lavender:#7287fd;
  --text:#4c4f69;--sub1:#5c5f77;--sub0:#6c6f85;--ov2:#7c7f93;--ov1:#8c8fa1;--ov0:#9ca0b0;--s2:#acb0be;--s1:#bcc0cc;--s0:#ccd0da;
  --base:#eff1f5;--mantle:#e6e9ef;--crust:#dce0e8;--node:#ffffff;--code:#f6f7fa;--on-primary:#ffffff;--layer-silver:var(--lavender);
  --shadow:0 4px 10px -3px rgb(76 79 105/.18);--shadow-lg:0 18px 40px -12px rgb(76 79 105/.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-ligatures:none}
kbd{font:500 10px var(--mono);padding:1px 5px;border-radius:3px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}

.app{height:100vh;display:grid;grid-template-rows:44px 1fr 36px}
/* navbar */
.nav{display:flex;align-items:center;gap:10px;padding-inline:12px;background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;letter-spacing:-.02em}
.brand svg{color:var(--primary)}
.crumb{display:flex;gap:6px;color:var(--muted);font-size:12px}
.crumb b{color:var(--fg);font-weight:500}
.saved{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.saved i{width:6px;height:6px;border-radius:50%;background:var(--green)}
.sp{flex:1}
.search{display:flex;align-items:center;gap:8px;width:260px;max-width:34vw;padding:5px 8px;border-radius:7px;cursor:pointer;
  background:var(--bg);border:1px solid var(--border);color:var(--muted);font-size:12px}
.search kbd{margin-left:auto}
.ib{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.ib:hover{background:var(--surface);color:var(--fg)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--surface);cursor:pointer;font-size:12px;font-weight:500}
.btn:hover{background:var(--surface-h)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent;font-weight:600}
.chip{font:600 10px var(--mono);padding:1px 5px;border-radius:3px;background:rgb(0 0 0/.18)}

.main{display:grid;grid-template-columns:44px 220px 1fr 256px;min-height:0}
.main.nopanel{grid-template-columns:44px 0 1fr 256px}
.rail{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:4px;padding-block:8px}
.rail button{width:32px;height:32px;border:0;border-radius:7px;background:transparent;color:var(--sub1);cursor:pointer;display:grid;place-items:center}
.rail button:hover{background:var(--surface);color:var(--fg)}
.rail button[aria-pressed="true"]{background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--primary)}
.rail .gap{flex:1}

.side{background:var(--panel);border-right:1px solid var(--border);overflow:auto;min-width:0}
.side h4{margin:0;padding:12px 12px 6px;font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center}
.side h4 span{margin-left:auto;font:400 10px var(--mono);letter-spacing:0;text-transform:none}
.tfilter{margin:0 10px 6px;width:calc(100% - 20px);padding:5px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--fg);font:11px var(--mono)}
.grp{display:flex;align-items:center;gap:6px;padding:6px 12px 3px;font:500 10.5px var(--mono);color:var(--muted)}
.grp i{width:7px;height:7px;border-radius:2px}
.trow{display:flex;align-items:center;gap:7px;margin-inline:6px;padding:3px 8px 3px 16px;border-radius:5px;cursor:pointer;font:11.5px var(--mono);border-left:2px solid transparent}
.trow:hover{background:var(--surface)}
.trow.on{background:var(--surface);border-left-color:var(--primary);color:var(--primary)}
.trow .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .c{font-size:10px;color:var(--muted)}
.trow.hid{opacity:.45}
.lrow{display:flex;align-items:center;gap:10px;margin-inline:6px;padding:8px;border-radius:6px}
.lrow:hover{background:var(--surface)}
.lrow i{width:10px;height:10px;border-radius:3px}
.lrow .n{flex:1;font:500 12px var(--mono)}
.lrow .c{font:11px var(--mono);color:var(--muted)}
.hint{margin:10px 12px;color:var(--muted);font-size:11.5px;line-height:1.5}
.vrow{display:flex;align-items:center;gap:8px;margin-inline:6px;padding:6px 8px;border-radius:6px;cursor:pointer;font:12px var(--mono)}
.vrow:hover{background:var(--surface)}
.vrow.on{background:var(--surface);color:var(--primary)}
.vrow .c{margin-left:auto;font-size:10.5px;color:var(--muted)}

/* canvas */
.cwrap{position:relative;overflow:hidden;background:var(--bg);min-width:0}
.canvas{position:absolute;inset:0;cursor:default;touch-action:none;
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:16px 16px}
.canvas.panning{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
svg.edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
svg.edges path{fill:none}
.e-hit{stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
.e-fk{stroke:var(--rel-fk);stroke-width:1.4}
.e-lin{stroke:var(--rel-lin);stroke-width:1.5;stroke-dasharray:5 4}
.e-agg{stroke-width:1.1;opacity:.55}
.e-dim{opacity:.1}
.e-on{stroke-width:2.6;opacity:1}
.e-temp{stroke:var(--primary);stroke-width:2;stroke-dasharray:4 4}
@media (prefers-reduced-motion:no-preference){.e-lin{animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-18}}}

.node{position:absolute;width:248px;border-radius:8px;background:var(--node);border:1px solid var(--border);box-shadow:var(--shadow);transition:opacity .15s,border-color .15s}
.node.sel{border-color:var(--primary);box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 50%,transparent),0 0 24px -6px color-mix(in srgb,var(--primary) 50%,transparent)}
.node.dim{opacity:.28}
.node::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;border-radius:8px 0 0 8px;background:var(--tint)}
.nh{height:34px;display:flex;align-items:center;gap:7px;padding:0 8px 0 11px;border-bottom:1px solid var(--border);cursor:grab;border-radius:8px 8px 0 0;
  background:color-mix(in srgb,var(--surface) 70%,var(--node))}
.nh .nm{font:500 12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nh .nm s{text-decoration:none;color:var(--muted)}
.nh .ly{margin-left:auto;font:500 9.5px var(--mono);color:var(--tint);text-transform:lowercase}
.nh svg{color:var(--tint);flex:none}
.ncount{height:30px;display:flex;align-items:center;padding-inline:11px;font:10.5px var(--mono);color:var(--muted);gap:10px}
.ncount b{color:var(--fg);font-weight:500}
.nfilt{height:34px;padding:5px 8px 5px 11px;border-bottom:1px solid var(--border)}
.nfilt input{width:100%;height:24px;padding:0 7px;border-radius:5px;border:1px solid var(--border);background:var(--bg);color:var(--fg);font:10.5px var(--mono)}
.cols{list-style:none;margin:0;padding:0;position:relative}
.cols.scroll{max-height:392px;overflow-y:auto;overflow-x:hidden}
.col{position:relative;height:28px;display:flex;align-items:center;gap:7px;padding:0 9px 0 11px;font:11px var(--mono);cursor:pointer}
.col:hover{background:var(--surface)}
.col.on{background:color-mix(in srgb,var(--primary) 16%,transparent)}
.col.tr{background:color-mix(in srgb,var(--primary) 9%,transparent)}
.col .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col .ct{margin-left:auto;font-size:10px;color:var(--muted);white-space:nowrap;flex:none;max-width:92px;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ov0);opacity:.55}
.dot.pk{background:var(--key-pk);opacity:1}
.dot.fk{background:transparent;border:1.5px solid var(--key-fk);opacity:1}
.dot.pin{background:var(--pin);opacity:1}
.bdg{font:600 8.5px var(--mono);padding:1px 4px;border-radius:3px;flex:none}
.bdg.pk{background:color-mix(in srgb,var(--key-pk) 20%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--key-pk) 50%,transparent)}
.bdg.fk{background:color-mix(in srgb,var(--key-fk) 20%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--key-fk) 50%,transparent)}
.sec{height:22px;display:flex;align-items:end;padding:0 11px 3px;font:9px var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
/* port: sits half outside the border, 24px hit area */
.port{position:absolute;top:50%;width:24px;height:24px;margin-top:-12px;display:grid;place-items:center;cursor:crosshair;opacity:0;z-index:2}
.port.r{right:-12px}.port.l{left:-12px}
.port i{width:10px;height:10px;border-radius:50%;background:var(--node);border:2px solid var(--primary);transition:transform .1s}
.port:hover i{transform:scale(1.35);background:var(--primary)}
.col:hover .port,.canvas.linking .port{opacity:1}
.canvas.linking .col:hover{background:color-mix(in srgb,var(--primary) 22%,transparent)}
.more{display:block;margin:4px 8px 8px 11px;width:calc(100% - 19px);padding:5px 8px;text-align:left;border-radius:5px;cursor:pointer;
  background:var(--surface);border:1px dashed var(--border);color:var(--muted);font:10.5px var(--mono)}
.more:hover{color:var(--fg);background:var(--surface-h)}
.nfoot{height:26px;display:flex;align-items:center;padding-inline:11px;font:10px var(--mono);color:var(--muted);border-top:1px solid var(--border)}
.newname{position:absolute;z-index:5}
.newname input{width:248px;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--primary);background:var(--node);color:var(--fg);font:500 12px var(--mono);box-shadow:var(--shadow-lg)}

.overlay-hint{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;max-width:calc(100% - 24px)}
.overlay-hint span{pointer-events:auto;font-size:11px;padding:4px 8px;border-radius:6px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--border);color:var(--muted)}
.overlay-hint b{color:var(--fg);font-weight:500}

/* drawer */
.drawer{position:absolute;left:0;right:0;bottom:0;height:46%;background:var(--panel);border-top:1px solid var(--border);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;transform:translateY(102%);transition:transform .18s cubic-bezier(.2,.8,.2,1);z-index:6}
.drawer.open{transform:none}
.dh{height:36px;flex:none;display:flex;align-items:center;gap:4px;padding-inline:8px;border-bottom:1px solid var(--border)}
.tab{border:0;background:transparent;padding:5px 10px;border-radius:5px;cursor:pointer;color:var(--muted);font:500 11.5px var(--mono)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg)}
.dh .path{margin-left:8px;font:11px var(--mono);color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
pre.code{margin:0;flex:1;overflow:auto;padding-block:8px;background:var(--code);font:11.5px/1.7 var(--mono);font-variant-ligatures:none}
.ln{display:flex;gap:14px;padding-inline:12px;white-space:pre}
.ln .g{width:22px;flex:none;text-align:right;color:var(--ov0);user-select:none}
.k{color:var(--mauve)}.s{color:var(--green)}.t{color:var(--yellow)}.n{color:var(--peach)}.c{color:var(--ov2);font-style:italic}.o{color:var(--sky)}

/* inspector */
.insp{background:var(--panel);border-left:1px solid var(--border);overflow:auto;min-width:0}
.ih{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-weight:600}
.ih .sub{font:400 11px var(--mono);color:var(--muted);margin-left:auto}
.ir{padding:8px 14px;border-top:1px solid var(--border)}
.ir .lb{font-size:10.5px;color:var(--muted);margin-bottom:4px;display:flex;align-items:center}
.ir .lb button{margin-left:auto}
.ir .vl{font:12px var(--mono);overflow-wrap:anywhere}
.ir input[type=text],.ir select,.ir textarea{width:100%;padding:5px 7px;border-radius:5px;border:1px solid var(--border);background:var(--bg);color:var(--fg);font:12px var(--mono)}
.ir textarea{font-family:var(--sans);resize:vertical;min-height:52px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.lchip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:var(--surface);font:10.5px var(--mono);cursor:pointer;border:1px solid transparent}
.lchip i{width:7px;height:7px;border-radius:50%;background:var(--tint)}
.lchip[aria-pressed="true"]{border-color:var(--tint)}
.sw{display:flex;gap:6px}
.sw button{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--fg)}
.sw .none{background:transparent;border:1.5px dashed var(--ov0)}
.link{display:flex;align-items:center;gap:6px;padding:3px 0;font:11px var(--mono);cursor:pointer;color:var(--sub1)}
.link:hover{color:var(--primary)}
.link em{font-style:normal;color:var(--muted)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{padding:3px 8px;border-radius:5px;border:1px solid var(--border);background:transparent;cursor:pointer;font:500 10.5px var(--mono);color:var(--muted)}
.tg[aria-pressed="true"]{background:color-mix(in srgb,var(--primary) 18%,transparent);border-color:color-mix(in srgb,var(--primary) 50%,transparent);color:var(--fg)}
.empty-insp{padding:14px;color:var(--muted);font-size:12px}
.empty-insp dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:14px 0 0;font-size:11.5px}
.empty-insp dt{white-space:nowrap}
.danger{color:var(--red)}

/* status bar */
.status{display:flex;align-items:center;gap:8px;padding-inline:10px;background:var(--panel);border-top:1px solid var(--border);font-size:11.5px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;background:var(--surface);border:0;cursor:pointer;font-size:11px;white-space:nowrap}
.pill.warn{background:color-mix(in srgb,var(--yellow) 22%,transparent)}
.pill .sq{width:14px;height:2px;border-radius:1px}
.pill[aria-pressed="false"]{background:transparent;color:var(--muted);text-decoration:line-through}
.lod{font:600 9.5px var(--mono);padding:3px 7px;border-radius:4px;background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--primary);min-width:62px;text-align:center}
.zoom{display:flex;align-items:center;gap:8px}
.zoom input{width:120px;accent-color:var(--primary)}
.zoom .pct{font:11px var(--mono);width:38px;text-align:right}

/* popovers */
.pop{position:fixed;z-index:20;min-width:220px;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-lg);padding:4px}
.pop .ph{padding:6px 8px 4px;font-size:10.5px;color:var(--muted)}
.pop button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:6px 8px;border-radius:5px;cursor:pointer;text-align:left;font-size:12px}
.pop button:hover,.pop button.act{background:var(--surface)}
.pop button small{margin-left:auto;color:var(--muted);font:10.5px var(--mono)}
.pal{position:fixed;inset:0;z-index:30;background:rgb(0 0 0/.35);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 0}
.pal .box{width:560px;max-width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);overflow:hidden}
.pal input{width:100%;padding:13px 14px;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--fg);font:14px var(--sans);outline:none}
.pal ul{list-style:none;margin:0;padding:4px;max-height:340px;overflow:auto}
.pal li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12.5px}
.pal li.act{background:var(--surface)}
.pal li .kind{font:10px var(--mono);color:var(--muted);width:56px;flex:none}
.pal li small{margin-left:auto;font:10.5px var(--mono);color:var(--muted)}
.pal .grph{padding:8px 10px 2px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:default}
.toasts{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:8;align-items:center}
.toast{display:flex;align-items:center;gap:12px;padding:7px 8px 7px 12px;border-radius:8px;background:var(--crust);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow-lg);font-size:12px;white-space:nowrap}
.toast button{border:0;background:var(--surface);color:var(--fg);padding:3px 8px;border-radius:5px;cursor:pointer;font-weight:500;font-size:11.5px}

/* v2 */
.seg{display:inline-flex;padding:2px;border-radius:7px;background:var(--surface);gap:2px}
.seg button{border:0;background:transparent;padding:3px 10px;border-radius:5px;cursor:pointer;font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--node);color:var(--fg);box-shadow:var(--shadow)}
.seg .sq{width:14px;height:2px;border-radius:1px}
.bdg.ix{background:color-mix(in srgb,var(--sky) 18%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sky) 50%,transparent)}
.dot.ix{background:transparent;border:1.5px dashed var(--sky);opacity:1}
.col.mk .cn{color:var(--mk);font-weight:600}
.col.mk::after{content:"";position:absolute;left:4px;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--mk)}
.e-ix{stroke:var(--rel-fk);stroke-width:1.4;stroke-dasharray:1.5 3;stroke-linecap:round}
.elabel rect{fill:var(--crust);stroke:var(--rel-lin);stroke-width:1}
.elabel text{fill:var(--text);font:10px var(--mono)}
.txbox{font:12px/1.5 var(--mono)!important;min-height:64px!important}

/* ───── layout: columns by layer ───── */
/* Arrange: what LocalDrawDB did (dagre per connected component + grid pack + overlap pass),
   rethought for a medallion model:
   1. rank = layer (bronze → silver → gold), one band per layer;
   2. order inside a band by barycenter of neighbours (lineage + relationships), 4 sweeps,
      so connected tables sit level with each other and edges barely cross;
   3. tables with no connection go to the bottom of their band;
   4. a band taller than the tallest viewport-friendly height wraps into sub-columns;
   5. heights come from the node's current detail level, so nothing overlaps;
   6. then fit to screen. */
/* The arrange follows the active mode.
   Both split the model into connected groups, lay each group out on its own and pack the groups
   as rectangles in rows sized to the screen proportion — so 56 tables become a 2D map, never one
   tall stack. Loose tables (no edge in this mode) go to a compact grid at the end.
   · Linhagem: each group is a left→right flow; column = longest path from its sources
     (not the layer name), order inside a column by barycenter so chains stay level.
   · Relacionamentos: each group is an ER cluster; tables that only reference others (facts, children)
     on the left, referenced ones (dimensions, parents) on the right, ordered by barycenter. */
function organize(silent){
  var lod=lodName(),tr=traceSet(),vis=S.tables.filter(inView),GX=96,GY=28,GAP=110;
  var ids={};vis.forEach(function(t){ids[t.id]=t});
  var edges=(U.mode==="lin"?S.lin:S.fks).filter(function(e){return ids[e.from.t]&&ids[e.to.t]&&e.from.t!==e.to.t});
  // table-level directed graph: lin = from→to; fk = child→parent
  var out={},inc={},und={};vis.forEach(function(t){out[t.id]={};inc[t.id]={};und[t.id]={}});
  edges.forEach(function(e){out[e.from.t][e.to.t]=1;inc[e.to.t][e.from.t]=1;und[e.from.t][e.to.t]=1;und[e.to.t][e.from.t]=1});
  var hOf=function(t){return nodeGeom(t,lod,tr).h+10};
  // connected groups
  var seen={},groups=[],loose=[];
  vis.forEach(function(t){
    if(seen[t.id])return;
    if(!Object.keys(und[t.id]).length){seen[t.id]=1;loose.push(t);return}
    var g=[],st=[t.id];seen[t.id]=1;
    while(st.length){var id=st.pop();g.push(ids[id]);Object.keys(und[id]).forEach(function(n){if(!seen[n]){seen[n]=1;st.push(n)}})}
    groups.push(g);
  });
  // rank inside a group
  function rankOf(g){
    var memo={},onStack={};
    function depth(id,adj){ // longest path following adj, cycle-safe
      if(memo[id]!=null)return memo[id];if(onStack[id])return 0;onStack[id]=1;
      var d=0;Object.keys(adj[id]).forEach(function(n){if(ids[n])d=Math.max(d,1+depth(n,adj))});
      onStack[id]=0;return memo[id]=d;
    }
    var r={};
    if(U.mode==="lin")g.forEach(function(t){r[t.id]=depth(t.id,inc)});           // distance from sources
    else{var mx=0;g.forEach(function(t){r[t.id]=depth(t.id,out);mx=Math.max(mx,r[t.id])});
      g.forEach(function(t){r[t.id]=mx-r[t.id]})}                                  // parents right
    return r;
  }
  function layoutGroup(g){
    var r=rankOf(g),cols=[];
    g.forEach(function(t){(cols[r[t.id]]=cols[r[t.id]]||[]).push(t)});
    cols=cols.filter(Boolean);
    var pos={};cols.forEach(function(c){c.sort(function(a,b){return a.name<b.name?-1:1});c.forEach(function(t,i){pos[t.id]=i})});
    for(var s=0;s<6;s++){(s%2?cols.slice().reverse():cols).forEach(function(c){
      c.forEach(function(t){var n=Object.keys(und[t.id]);t._bc=n.length?n.reduce(function(a,id){return a+(pos[id]||0)},0)/n.length:pos[t.id]});
      c.sort(function(a,b){return a._bc-b._bc});c.forEach(function(t,i){pos[t.id]=i;delete t._bc});
    })}

    var total=g.reduce(function(a,t){return a+hOf(t)+GY},0),maxH=Math.max(700,Math.sqrt(total*(W+GX))*1.1);
    var x=0,w=0,h=0,place=[];
    cols.forEach(function(c){
      var y=0,cx=x;
      c.forEach(function(t){var th=hOf(t);if(y>0&&y+th>maxH){cx+=W+36;y=0}place.push([t,cx,y]);y+=th+GY;h=Math.max(h,y)});
      x=cx+W+GX;
    });
    // center each column vertically against the tallest one
    var byX={};place.forEach(function(p){var k=p[1];byX[k]=Math.max(byX[k]||0,p[2]+hOf(p[0]))});
    place.forEach(function(p){p[2]+=Math.max(0,(h-GY-byX[p[1]])/2)});
    return{place:place,w:x-GX,h:h-GY};
  }
  var boxes=groups.map(layoutGroup).sort(function(a,b){return b.w*b.h-a.w*a.h});
  if(loose.length){ // compact grid
    var n=Math.ceil(Math.sqrt(loose.length*1.6)),place=[],colY=[];
    loose.sort(function(a,b){return a.layer===b.layer?(a.name<b.name?-1:1):LAYERS.indexOf(a.layer)-LAYERS.indexOf(b.layer)});
    loose.forEach(function(t,i){var c=i%n;colY[c]=colY[c]||0;place.push([t,c*(W+36),colY[c]]);colY[c]+=hOf(t)+GY});
    boxes.push({place:place,w:Math.min(n,loose.length)*(W+36)-36,h:Math.max.apply(null,colY)-GY,loose:true});
  }
  // shelf-pack boxes to the screen proportion
  var r=$("cwrap").getBoundingClientRect(),aspect=Math.max(1.2,r.width/Math.max(1,r.height));
  var area=boxes.reduce(function(a,b){return a+(b.w+GAP)*(b.h+GAP)},0),rowW=Math.max(boxes.length?boxes[0].w:0,Math.sqrt(area*aspect));
  var x=40,y=40,rowH=0;
  boxes.forEach(function(b){
    if(x>40&&x+b.w>40+rowW){x=40;y+=rowH+GAP;rowH=0}
    b.place.forEach(function(p){p[0].x=Math.round((x+p[1])/8)*8;p[0].y=Math.round((y+p[2])/8)*8});
    x+=b.w+GAP;rowH=Math.max(rowH,b.h);
  });
  if(!silent)toast(U.mode==="lin"?"Arranjado para ler a linhagem · "+groups.length+" fluxo"+(groups.length===1?"":"s"):"Arranjado para ler os relacionamentos · "+groups.length+" grupo"+(groups.length===1?"":"s"));
}

  });
  if(ids.length)L.push("from "+al[ids[0]]);
  ids.slice(1).forEach(function(id){L.push("left join "+al[id]+" using (pedido_id)")});
  if(t.id==="g_agg")L.push("group by 1, 2");
  return L;
}
function genDdl(t){
  var L=["CREATE TABLE IF NOT EXISTS "+t.name+" ("];
  t.cols.forEach(function(c,i){L.push("  "+c.n+" "+sqlType(c.t)+(c.nn?" NOT NULL":"")+(i<t.cols.length-1||t.cols.some(function(x){return x.pk})?",":""))});
  var pk=t.cols.filter(function(c){return c.pk}).map(function(c){return c.n});
  if(pk.length)L.push("  CONSTRAINT pk_"+short(t)+" PRIMARY KEY ("+pk.join(", ")+")");
  L.push(") USING DELTA");
  if(t.desc)L.push("COMMENT "+"'"+t.desc.replace(/'/g,"''")+"'");
  return L.map(function(l,i){return l+(i===L.length-1?";":"")});
}
function hl(line,tab){
  var s=esc(line);
  if(/^\s*--/.test(line))return'<span class="c">'+s+"</span>";
  if(tab==="yml")return s.replace(/^(\s*-?\s*)([\w]+)(:)/,'$1<span class="k">$2</span><span class="o">$3</span>').replace(/(&quot;[^&]*?&quot;|'[^']*')/g,'<span class="s">$1</span>');
  return s.replace(/('[^']*')/g,'<span class="s">$1</span>').replace(/\b(CREATE|TABLE|IF|NOT|EXISTS|NULL|CONSTRAINT|PRIMARY|KEY|USING|COMMENT|with|as|select|from|left|join|using|group|by|sum|count|config|source|ref|null)\b/g,'<span class="k">$1</span>')
    .replace(/\b(BIGINT|INT|STRING|DATE|TIMESTAMP|BOOLEAN|DOUBLE|DECIMAL)\b/g,'<span class="t">$1</span>').replace(/\b(\d+)\b/g,'<span class="n">$1</span>');
}

var canvas=$("canvas"),drag=null,linking=null,tempPath=null;
function world(ev){var r=canvas.getBoundingClientRect();return{x:(ev.clientX-r.left-U.px)/U.zoom,y:(ev.clientY-r.top-U.py)/U.zoom}}

canvas.addEventListener("pointerdown",function(ev){
  if(ev.button!==0)return;closePop();
  var port=ev.target.closest("[data-port]");
  if(port){var li=port.closest(".col");linking={t:li.dataset.t,c:li.dataset.c,side:port.dataset.port};canvas.classList.add("linking");canvas.setPointerCapture(ev.pointerId);ev.preventDefault();renderHint();return}
  if(ev.target.closest("input,button"))return;
  var edge=ev.target.closest("[data-edge]");
  if(edge){U.sel=null;U.selCol=null;U.selEdge=edge.dataset.edge;render();return}
  var head=ev.target.closest("[data-drag]");
  if(head){var t=T(head.dataset.drag);drag={kind:"node",t:t,sx:ev.clientX,sy:ev.clientY,ox:t.x,oy:t.y,moved:false};canvas.setPointerCapture(ev.pointerId);return}
  if(ev.target.closest(".col"))return;
  if(ev.target.closest(".node"))return;
  drag={kind:"pan",sx:ev.clientX,sy:ev.clientY,ox:U.px,oy:U.py,moved:false};canvas.setPointerCapture(ev.pointerId);
});
canvas.addEventListener("pointermove",function(ev){
  if(linking){
    var src=T(linking.t),a=anchor(src,linking.c,linking.side),p=world(ev);
    tempPath=pathBetween(a,p,linking.side,p.x>a.x?"l":"r");renderEdges();return;
  }
  if(!drag)return;
  var dx=ev.clientX-drag.sx,dy=ev.clientY-drag.sy;
  if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<4)return;
  if(!drag.moved&&drag.kind==="node")snap();
  drag.moved=true;
  if(drag.kind==="pan"){canvas.classList.add("panning");U.px=drag.ox+dx;U.py=drag.oy+dy;applyTransform()}
  else{drag.t.x=Math.round((drag.ox+dx/U.zoom)/8)*8;drag.t.y=Math.round((drag.oy+dy/U.zoom)/8)*8;
    var el=document.querySelector('.node[data-t="'+drag.t.id+'"]');el.style.left=drag.t.x+"px";el.style.top=drag.t.y+"px";renderEdges()}
});
canvas.addEventListener("pointerup",function(ev){
  canvas.classList.remove("panning");

    var L=linking;linking=null;tempPath=null;canvas.classList.remove("linking");

    renderEdges();renderHint();

    connect(L,{t:li.dataset.t,c:li.dataset.c},ev);return;
  }
  if(!drag)return;
  var d=drag;drag=null;
  if(!d.moved){
    if(d.kind==="node")select(d.t.id);
    else if(U.sel||U.selEdge||U.adding){U.sel=null;U.selCol=null;U.selEdge=null;U.adding=null;render()}

canvas.addEventListener("wheel",function(ev){

/* connection kind comes from the drop, not from a mode */
/* the active mode decides what a drag creates — no guessing */
function connect(a,b,ev){
  var ta=T(a.t),tb=T(b.t);
  if(U.mode==="lin"){
    // lineage always flows from the lower layer up; same layer keeps drag direction
    return LAYERS.indexOf(ta.layer)>LAYERS.indexOf(tb.layer)?addLin(b,a):addLin(a,b);
  }
  var tc=tb.cols.filter(function(x){return x.n===b.c})[0];
  if(tc.pk)return addFk(a,b,"pk");
  if(isIdxCol(b.t,b.c))return addFk(a,b,"index");
  pop(ev.clientX,ev.clientY,short(tb)+"."+b.c+" não é PK nem tem índice",[
    {label:"Criar índice único e relacionar",sub:"ux_"+short(tb)+"_"+b.c,fn:function(){snap();tb.idx.push({name:"ux_"+short(tb)+"_"+b.c,cols:[b.c],unique:true});S.fks.push({id:"e"+S.seq++,from:a,to:b,via:"index"});render();toast("Índice criado e relacionamento por índice",{label:"Desfazer",fn:undo})}},
    {label:"Relacionar à PK de "+short(tb),sub:(tb.cols.filter(function(x){return x.pk})[0]||{n:"—"}).n,fn:function(){var pk=tb.cols.filter(function(x){return x.pk})[0];if(pk)addFk(a,{t:b.t,c:pk.n},"pk")}},
    {label:"Cancelar",fn:function(){}}]);
}
function addLin(a,b){
  if(S.lin.some(function(e){return e.from.t===a.t&&e.from.c===a.c&&e.to.t===b.t&&e.to.c===b.c}))return toast("Essa linhagem já existe");
  snap();var id="e"+S.seq++;S.lin.push({id:id,from:a,to:b});U.sel=b.t;U.selCol=b.c;render();
  toast("Linhagem criada · "+short(T(a.t))+"."+a.c+" → "+short(T(b.t))+"."+b.c,{label:"Desfazer",fn:undo});
}
function addFk(a,b,via){
  if(S.fks.some(function(e){return e.from.t===a.t&&e.from.c===a.c&&e.to.t===b.t}))return toast("Esse relacionamento já existe");
  snap();S.fks.push({id:"e"+S.seq++,from:a,to:b,via:via||"pk"});render();
  toast("Relacionamento "+(via==="index"?"por índice":"FK → PK")+" · "+short(T(a.t))+"."+a.c+" ⟶ "+short(T(b.t))+"."+b.c,{label:"Desfazer",fn:undo});
}

function createTable(v,layer,x,y){
  if(v.indexOf(".")<0)v=(layer||"silver")+"."+v;
  if(!/^\w+\.\w+$/.test(v)){toast("Use camada.nome, só letras, números e _");return null}
  var ly=v.split(".")[0];if(LAYERS.indexOf(ly)<0){ly=layer||"silver";v=ly+"."+v.split(".")[1]}
  if(S.tables.some(function(t){return t.name===v})){toast("Já existe uma tabela "+v);return null}
  snap();var id="n"+S.seq++;
  S.tables.push({id:id,name:v,layer:ly,x:x,y:y,mat:ly==="bronze"?"source":"table",desc:"",color:null,idx:[],cols:[C("id","bigint","pk")]});
  toast("Tabela criada · models/vendas/"+ly+"/_"+v.split(".")[1]+".yml",{label:"Desfazer",fn:undo});
  return id;
}
/* free spot below the lowest table of that layer, so a table created from the tree never lands on another */
function freeSpotFor(layer){

  if(!same.length){var r=$("cwrap").getBoundingClientRect();return{x:Math.round((r.width/2-U.px)/U.zoom),y:Math.round((r.height/3-U.py)/U.zoom)}}
  var best=same.reduce(function(a,t){var b=t.y+((geoms[t.id]||{}).h||200);return b>a.b?{t:t,b:b}:a},{b:-1e9});
  return{x:best.t.x,y:Math.round((best.b+40)/8)*8};
}

function openPal(){
  if(palEl)return;
  palEl=document.createElement("div");palEl.className="pal";
  palEl.innerHTML='<div class="box" role="dialog" aria-label="Buscar ou executar"><input type="text" id="palInput" placeholder="Buscar tabela, coluna ou comando…" autocomplete="off"><ul id="palList"></ul></div>';
  document.body.appendChild(palEl);
  var inp=$("palInput"),act=0,items=[];
  function build(){
    var q=inp.value.trim().toLowerCase();items=[];
    commands().forEach(function(c){if(!q||c.label.toLowerCase().indexOf(q)>-1)items.push(c)});
    S.tables.forEach(function(t){if(!q||t.name.indexOf(q)>-1)items.push({g:"Tabelas",kind:t.layer,label:t.name,sub:t.cols.length+" col",fn:function(){focusTable(t.id)}})});
    if(q.length>1)S.tables.forEach(function(t){t.cols.forEach(function(c){if(c.n.indexOf(q)>-1&&items.length<60)items.push({g:"Colunas",kind:c.t.split("(")[0],label:c.n,sub:t.name,fn:function(){U.expanded[t.id]=true;focusTable(t.id,c.n)}})})});
    if(!q){items=items.filter(function(i){return i.g!=="Tabelas"}).slice(0,8).concat(items.filter(function(i){return i.g==="Tabelas"}).slice(0,6))}
    act=Math.min(act,Math.max(0,items.length-1));
    var last="",h="";
    items.forEach(function(it,i){if(it.g!==last){h+='<li class="grph">'+it.g+'</li>';last=it.g}
      h+='<li data-i="'+i+'" class="'+(i===act?"act":"")+'">'+(it.kind?'<span class="kind">'+esc(it.kind)+'</span>':"")+esc(it.label)+(it.sub?'<small>'+esc(it.sub)+'</small>':"")+'</li>'});
    $("palList").innerHTML=h||'<li style="color:var(--muted)">Nada encontrado</li>';
  }
  function run(i){var it=items[i];closePal();if(it)it.fn()}
  inp.addEventListener("input",function(){act=0;build()});
  inp.addEventListener("keydown",function(e){
    if(e.key==="ArrowDown"){act=Math.min(items.length-1,act+1);build();e.preventDefault()}
    if(e.key==="ArrowUp"){act=Math.max(0,act-1);build();e.preventDefault()}
    if(e.key==="Enter")run(act);
    if(e.key==="Escape")closePal();
  });
  palEl.addEventListener("click",function(e){var li=e.target.closest("[data-i]");if(li)run(+li.dataset.i);else if(e.target===palEl)closePal()});
  build();inp.focus();
}

  var r=$("cwrap").getBoundingClientRect();
  var z=Math.min(1.05,Math.max(.3,Math.min((r.width-60)/(maxx-minx),(r.height-60)/(maxy-miny))));
  var before=lodName();U.zoom=z;U.px=(r.width-(maxx-minx)*z)/2-minx*z;U.py=Math.max(20,(r.height-(maxy-miny)*z)/2-miny*z);
  if(lodName()!==before){renderNodes();renderEdges()}applyTransform();
}

document.addEventListener("keydown",function(e){

  if(e.key==="Escape"){closePop();if(U.selCol)U.selCol=null;else{U.sel=null;U.selEdge=null}render()}
  if((e.key==="Delete"||e.key==="Backspace")&&U.selEdge){var b=document.createElement("button");b.id="delEdge";$("insp").appendChild(b);b.click()}
  if(mod&&e.key==="0"){e.preventDefault();fitView()}

  if(!mod&&e.key.toLowerCase()==="r")setMode("fk");
  if(!mod&&e.shiftKey&&e.key.toLowerCase()==="a")arrange();
});

function loadLake(){
  if(S.tables.length>=56)return toast("O data lake já está carregado");
  snap();
  var AREAS=[
    {k:"estoque",ents:[["produto",["produto_id:pk","sku","descricao","categoria_id:fk:categoria","fornecedor_id:fk:fornecedor"]],["categoria",["categoria_id:pk","nome"]],["fornecedor",["fornecedor_id:pk","razao_social","cnpj"]],["deposito",["deposito_id:pk","uf","capacidade"]],["movimentacao",["mov_id:pk","produto_id:fk:produto","deposito_id:fk:deposito","qtd","dt_mov"]]],
      gold:[["fct_giro_produto",["produto_id:pk","dt_ref:pk","qtd_saida","qtd_media"],["movimentacao","produto"]],["dim_produto",["produto_id:pk","sku","categoria","fornecedor"],["produto","categoria","fornecedor"]],["agg_ruptura",["deposito_id:pk","dt_ref:pk","qtd_ruptura"],["movimentacao","deposito"]]]},
    {k:"logistica",ents:[["entrega",["entrega_id:pk","pedido_id","transportadora_id:fk:transportadora","rota_id:fk:rota","dt_prevista","dt_real"]],["transportadora",["transportadora_id:pk","nome","cnpj"]],["rota",["rota_id:pk","origem_uf","destino_uf","km"]],["ocorrencia",["ocorrencia_id:pk","entrega_id:fk:entrega","tipo","dt_ocorrencia"]]],
      gold:[["fct_entregas",["entrega_id:pk","dias_atraso","km","custo_frete"],["entrega","rota","ocorrencia"]],["agg_sla_transportadora",["transportadora_id:pk","mes:pk","pct_no_prazo"],["entrega","transportadora"]],["dim_rota",["rota_id:pk","origem_uf","destino_uf","km"],["rota"]]]},
    {k:"financeiro",ents:[["titulo",["titulo_id:pk","conta_id:fk:conta","centro_custo_id:fk:centro_custo","valor","dt_vencimento"]],["conta",["conta_id:pk","codigo","descricao"]],["centro_custo",["centro_custo_id:pk","nome","area"]],["pagamento",["pagamento_id:pk","titulo_id:fk:titulo","valor_pago","dt_pagamento"]]],
      gold:[["fct_fluxo_caixa",["dt_ref:pk","conta_id:pk","entradas","saidas"],["titulo","pagamento","conta"]],["dim_centro_custo",["centro_custo_id:pk","nome","area"],["centro_custo"]],["agg_inadimplencia",["centro_custo_id:pk","mes:pk","valor_aberto"],["titulo","centro_custo"]]]},
    {k:"marketing",ents:[["campanha",["campanha_id:pk","canal","orcamento","dt_inicio"]],["lead",["lead_id:pk","campanha_id:fk:campanha","email","dt_lead"]],["cupom",["cupom_id:pk","campanha_id:fk:campanha","codigo","pct_desconto"]],["segmento",["segmento_id:pk","nome","regra"]]],
      gold:[["fct_conversao",["lead_id:pk","campanha_id","convertido","dt_conversao"],["lead","campanha"]],["agg_roi_campanha",["campanha_id:pk","mes:pk","roi"],["campanha","lead","cupom"]]]}
  ];
  var added=0,byName={};
  AREAS.forEach(function(a){
    a.ents.forEach(function(en){
      var bid="b_"+a.k+"_"+en[0],sid="s_"+a.k+"_"+en[0];byName[a.k+"."+en[0]]=sid;
      var cols=en[1].map(function(s){var p=s.split(":"),c=C(p[0],/_id$/.test(p[0])?"bigint":/^dt_/.test(p[0])?"date":/valor|km|qtd|pct|orcamento|capacidade/.test(p[0])?"decimal(18,2)":"string",p[1]==="pk"?"pk":"");return c});
      S.tables.push({id:bid,name:"bronze."+a.k+"_"+en[0],layer:"bronze",x:0,y:0,mat:"source",desc:"",color:null,idx:[],cols:JSON.parse(JSON.stringify(cols))});
      S.tables.push({id:sid,name:"silver."+en[0],layer:"silver",x:0,y:0,mat:"table",desc:"",color:null,idx:[],cols:JSON.parse(JSON.stringify(cols))});
      cols.forEach(function(c){ln(bid,c.n,sid,c.n)});added+=2;
    });
    a.ents.forEach(function(en){en[1].forEach(function(s){var p=s.split(":");if(p[1]==="fk")fk("s_"+a.k+"_"+en[0],p[0],byName[a.k+"."+p[2]],p[0])})});
    a.gold.forEach(function(g){
      var gid="g_"+a.k+"_"+g[0];
      var cols=g[1].map(function(s){var p=s.split(":");return C(p[0],/_id$/.test(p[0])?"bigint":/^dt_|mes/.test(p[0])?"date":/^(nome|sku|categoria|fornecedor|area|convertido)$/.test(p[0])?"string":"decimal(18,2)",p[1]==="pk"?"pk":"")});
      S.tables.push({id:gid,name:"gold."+g[0],layer:"gold",x:0,y:0,mat:"table",desc:"",color:null,idx:[],cols:cols});added++;
      cols.forEach(function(c,i){var src=g[2].map(function(n){return T(byName[a.k+"."+n])});
        var hit=null;src.forEach(function(st){if(!hit)st.cols.forEach(function(sc){if(sc.n===c.n)hit=[st.id,sc.n]})});
        if(!hit){var st=src[i%src.length];hit=[st.id,st.cols[Math.min(st.cols.length-1,1+(i%Math.max(1,st.cols.length-1)))].n];tx(gid,c.n,"agg","sum("+hit[1]+")")}
        ln(hit[0],hit[1],gid,c.n)});
    });
  });
  // cross-area links a real lake has
  ln("s_logistica_entrega","dt_real","g_fct","dt_venda");
  ln("s_marketing_cupom","pct_desconto","s_ped","valor_desconto");
  fk("g_estoque_fct_giro_produto","produto_id","g_estoque_dim_produto","produto_id");
  U.view="all";U.hiddenLayers={};U.sel=U.selCol=U.selEdge=null;U.zoom=.6;
  organize(true);render();fitView();
  toast("Data lake com "+S.tables.length+" tabelas · teste ⇧A em Linhagem e em Relacionamentos",{label:"Desfazer",fn:undo});
}

      '├─ dbt_project.yml        <span class="m"># name: '+esc(name.replace(/-/g,"_"))+', profile, model-paths</span>\n'+
      '├─ packages.yml           <span class="m"># dbt_utils fixado</span>\n'+
      '├─ profiles.example.yml   <span class="m"># spark/databricks, sem segredo</span>\n'+
      '├─ <span class="d">models/</span>\n│  └─ <span class="d">'+'&lt;projeto&gt;/</span>{bronze,silver,gold}/.gitkeep\n'+

      '├─ <span class="d">.strata/</span>domain.yml     <span class="m"># camadas, cores, versão do formato</span>\n'+
      '├─ .gitignore             <span class="m"># target/ dbt_packages/ logs/ profiles.yml</span>\n'+
      '├─ .gitattributes         <span class="m"># *.sql gerado → linguist-generated</span>\n'+
      '└─ README.md              <span class="m"># como abrir no Strata e rodar dbt</span>';
  }

    var name=($("ndName")||{}).value||"",url=($("ndUrl")||{}).value||"";
    var guessed=name||(url.split("/").pop()||"").replace(/\.git$/,"");
    var right=src==="adopt"?
      '<label>O que acontece</label><div class="tree2">Pasta já tem <span class="d">dbt_project.yml</span>:\n· nada é reescrito nem commitado ao abrir\n· projetos = pastas em models/\n· camadas lidas dos nomes das pastas\n· <span class="d">.strata/</span> só nasce no primeiro salvamento\n\nSem dbt_project.yml:\n· oferece aplicar o template num commit\n  separado, sem tocar no que já existe</div>':
      '<label>Primeiro commit · branch main</label><div class="tree2">'+tree(guessed)+'</div><label>Mensagem</label><div class="tree2" style="max-height:none">chore(strata): inicializa domínio '+esc(guessed||"novo-dominio")+'</div>';
    return'<header><h3>Novo domínio</h3><p>Um domínio é um repositório git com um projeto dbt. Projetos do Strata são pastas dentro dele.</p></header>'+
      '<div class="srcs">'+[["clone","Clonar repositório","URL do GitHub/GitLab. Vazio recebe o template."],["new","Criar do zero","Repositório local com o template; conecte o remoto depois."],["adopt","Abrir pasta dbt","Projeto dbt que você já tem na máquina."]].map(function(s){return'<button class="src" type="button" data-src="'+s[0]+'" aria-pressed="'+(src===s[0])+'"><b>'+s[1]+'</b><span>'+s[2]+'</span></button>'}).join("")+'</div>'+
      '<div class="mgrid"><div>'+
        (src==="clone"?'<label for="ndUrl">URL do repositório</label><input type="text" id="ndUrl" value="'+esc(url||"git@github.com:acme/dados-logistica.git")+'">':"")+
        (src==="adopt"?'<label for="ndPath">Pasta</label><input type="text" id="ndPath" value="~/www/dbt-logistica">':"")+
        '<label for="ndName">Nome do domínio</label><input type="text" id="ndName" value="'+esc(name)+'" placeholder="'+esc(guessed||"logistica")+'">'+
        (src!=="adopt"?'<label for="ndProj">Primeiro projeto</label><input type="text" id="ndProj" value="entregas"><label for="ndAdapter">Adapter</label><input type="text" id="ndAdapter" value="spark">':"")+
      '</div><div>'+right+'</div></div>'+
      '<footer><button class="btn" type="button" data-close>Cancelar</button><button class="btn primary" type="button" data-create>'+(src==="clone"?"Clonar e abrir":src==="new"?"Criar e fazer primeiro commit":"Abrir")+'</button></footer>';
  }
  function draw(){m.innerHTML='<div class="box" role="dialog" aria-label="Novo domínio">'+body()+'</div>'}
  draw();document.body.appendChild(m);
  m.addEventListener("click",function(e){
    var s=e.target.closest("[data-src]");if(s){src=s.dataset.src;draw();return}
    if(e.target===m||e.target.closest("[data-close]"))return m.remove();
    if(e.target.closest("[data-create]")){var n=$("ndName").value||$("ndName").placeholder;m.remove();$("crumbDomain").textContent=n;$("crumbProject").textContent=src==="adopt"?"—":$("ndProj").value;
      toast(src==="clone"?"Clonado · repositório vazio → template aplicado e enviado":src==="new"?"Domínio criado · 1 commit em main":"Pasta dbt aberta · nada foi alterado")}
  });
  m.addEventListener("input",function(e){if(e.target.id==="ndUrl"||e.target.id==="ndName"){var id=e.target.id,p=e.target.selectionStart;draw();var i=$(id);i.focus();i.setSelectionRange(p,p)}});
  m.addEventListener("keydown",function(e){if(e.key==="Escape")m.remove()});
}
