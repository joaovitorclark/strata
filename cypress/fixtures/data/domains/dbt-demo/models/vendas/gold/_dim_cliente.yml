version: 2
models:
  - name: dim_cliente
    config:
      tags:
        - strata:vendas
      meta:
        strata:
          table_id: gold.dim_cliente
          layer: gold
          schema: gold
          group: dimensoes
          pk:
            - id
          indexes:
            - columns:
                - email
                - nome
              name: idx_cliente_contato
      materialized: table
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - id
        warn_unsupported: false
      - type: unique
        columns:
          - email
        warn_unsupported: false
    columns:
      - name: id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: silver.stg_cliente.id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: email
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: silver.stg_cliente.email
              not_null: true
              unique: true
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: nome
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: silver.stg_cliente.nome
              not_null: true
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: status
        data_type: order_status
        config:
          meta:
            strata:
              enum: order_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - aberto
                  - pago
                  - cancelado
