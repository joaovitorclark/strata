version: 2
models:
  - name: documento
    config:
      tags:
        - strata:managed
        - strata:clientes
      schema: silver
      contract:
        enforced: true
      meta:
        strata:
          managed: true
    constraints:
      - type: primary_key
        columns:
          - documento_id
        warn_unsupported: false
    columns:
      - name: documento_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.documentos.documento_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: cliente_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.documentos.cliente_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: tipo
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.documentos.tipo
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: numero
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.documentos.numero
        constraints:
          - type: not_null
            warn_unsupported: false
