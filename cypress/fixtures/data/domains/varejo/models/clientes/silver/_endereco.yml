version: 2
models:
  - name: endereco
    config:
      tags:
        - strata:managed
        - strata:clientes
      schema: silver
      contract:
        enforced: true
      meta:
        strata:
          managed: true
    constraints:
      - type: primary_key
        columns:
          - endereco_id
        warn_unsupported: false
    columns:
      - name: endereco_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.enderecos.endereco_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: cliente_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.enderecos.cliente_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: tipo
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.enderecos.tipo
      - name: logradouro
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.enderecos.logradouro
      - name: cidade
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.enderecos.cidade
      - name: uf
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.enderecos.uf
      - name: cep
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.enderecos.cep
