version: 2
models:
  - name: dim_loja
    description: Tabela de negócio dim_loja no domínio varejo.
    config:
      tags:
        - strata:managed
        - strata:vendas
      schema: gold
      contract:
        enforced: true
      meta:
        strata:
          managed: true
    constraints:
      - type: primary_key
        columns:
          - loja_id
        warn_unsupported: false
    columns:
      - name: loja_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: silver.loja.loja_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: nome
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: silver.loja.nome
      - name: uf
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: silver.loja.uf
      - name: cidade
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: silver.loja.cidade
