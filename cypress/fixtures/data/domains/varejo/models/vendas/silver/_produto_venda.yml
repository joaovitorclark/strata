version: 2
models:
  - name: produto_venda
    config:
      tags:
        - strata:managed
        - strata:vendas
      schema: silver
      contract:
        enforced: true
      meta:
        strata:
          managed: true
    constraints:
      - type: primary_key
        columns:
          - produto_id
        warn_unsupported: false
      - type: unique
        columns:
          - sku
        warn_unsupported: false
    columns:
      - name: produto_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.produtos_venda.produto_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: sku
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.produtos_venda.sku
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: nome
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.produtos_venda.nome
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: categoria
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.produtos_venda.categoria
      - name: vl_tabela
        data_type: decimal(18,2)
        config:
          meta:
            strata:
              lineage:
                - from: bronze.produtos_venda.vl_tabela
