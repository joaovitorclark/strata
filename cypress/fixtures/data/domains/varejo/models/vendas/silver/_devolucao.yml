version: 2
models:
  - name: devolucao
    config:
      tags:
        - strata:managed
        - strata:vendas
      schema: silver
      contract:
        enforced: true
      meta:
        strata:
          managed: true
    constraints:
      - type: primary_key
        columns:
          - devolucao_id
        warn_unsupported: false
    columns:
      - name: devolucao_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.devolucoes.devolucao_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: pedido_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.devolucoes.pedido_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: item_seq
        data_type: int
        config:
          meta:
            strata:
              lineage:
                - from: bronze.devolucoes.item_seq
      - name: motivo
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.devolucoes.motivo
      - name: vl_estornado
        data_type: decimal(18,2)
        config:
          meta:
            strata:
              lineage:
                - from: bronze.devolucoes.vl_estornado
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: dt_devolucao
        data_type: timestamp
        config:
          meta:
            strata:
              lineage:
                - from: bronze.devolucoes.dt_devolucao
        constraints:
          - type: not_null
            warn_unsupported: false
