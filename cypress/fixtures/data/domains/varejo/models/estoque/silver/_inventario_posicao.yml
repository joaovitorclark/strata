version: 2
models:
  - name: inventario_posicao
    config:
      tags:
        - strata:managed
        - strata:estoque
      schema: silver
      contract:
        enforced: true
      meta:
        strata:
          managed: true
    constraints:
      - type: primary_key
        columns:
          - inventario_id
        warn_unsupported: false
    columns:
      - name: inventario_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.inventario.inventario_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: deposito_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.inventario.deposito_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: dt_contagem
        data_type: date
        config:
          meta:
            strata:
              lineage:
                - from: bronze.inventario.dt_contagem
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: status
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.inventario.status
