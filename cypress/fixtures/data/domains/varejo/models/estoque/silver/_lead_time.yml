version: 2
models:
  - name: lead_time
    config:
      tags:
        - strata:estoque
      schema: silver
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - produto_id
          - fornecedor_id
        warn_unsupported: false
    columns:
      - name: produto_id
        data_type: bigint
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: fornecedor_id
        data_type: bigint
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: dias
        data_type: int
