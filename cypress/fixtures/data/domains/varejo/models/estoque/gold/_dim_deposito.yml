version: 2
models:
  - name: dim_deposito
    description: Tabela de negócio dim_deposito no domínio varejo.
    config:
      tags:
        - strata:managed
        - strata:estoque
      schema: gold
      contract:
        enforced: true
      meta:
        strata:
          managed: true
    constraints:
      - type: primary_key
        columns:
          - deposito_id
        warn_unsupported: false
    columns:
      - name: deposito_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: silver.deposito.deposito_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: nome
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: silver.deposito.nome
      - name: uf
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: silver.deposito.uf
