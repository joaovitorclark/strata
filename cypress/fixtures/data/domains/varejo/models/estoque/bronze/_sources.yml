version: 2
sources:
  - name: bronze
    schema: bronze
    tables:
      - name: produtos
        description: Tabela de negócio produtos no domínio varejo.
        config:
          tags:
            - strata:estoque
        constraints:
          - type: primary_key
            columns:
              - produto_id
            warn_unsupported: false
        columns:
          - name: produto_id
            data_type: bigint
            data_tests:
              - not_null
          - name: sku
            data_type: string
            data_tests:
              - unique
              - not_null
          - name: nome
            data_type: string
            data_tests:
              - not_null
          - name: categoria
            data_type: string
          - name: marca
            data_type: string
      - name: fornecedores
        description: Tabela de negócio fornecedores no domínio varejo.
        config:
          tags:
            - strata:estoque
        constraints:
          - type: primary_key
            columns:
              - fornecedor_id
            warn_unsupported: false
        columns:
          - name: fornecedor_id
            data_type: bigint
            data_tests:
              - not_null
          - name: nome
            data_type: string
            data_tests:
              - not_null
          - name: cnpj
            data_type: string
            data_tests:
              - unique
      - name: movimentacoes
        description: Tabela de negócio movimentacoes no domínio varejo.
        config:
          tags:
            - strata:estoque
          meta:
            strata:
              indexes:
                - columns:
                    - produto_id
                    - dt_movimento
                  name: idx_mov_produto_dt
        constraints:
          - type: primary_key
            columns:
              - mov_id
            warn_unsupported: false
        columns:
          - name: mov_id
            data_type: bigint
            data_tests:
              - not_null
          - name: produto_id
            data_type: bigint
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze', 'produtos')
                    field: produto_id
          - name: deposito_id
            data_type: bigint
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze', 'depositos')
                    field: deposito_id
          - name: tipo
            data_type: string
            config:
              meta:
                strata:
                  enum: tipo_movimentacao
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - entrada
                      - saida
                      - ajuste
                      - transferencia
          - name: quantidade
            data_type: decimal(18,3)
            data_tests:
              - not_null
          - name: dt_movimento
            data_type: timestamp
            data_tests:
              - not_null
      - name: inventario
        description: Tabela de negócio inventario no domínio varejo.
        config:
          tags:
            - strata:estoque
        constraints:
          - type: primary_key
            columns:
              - inventario_id
            warn_unsupported: false
        columns:
          - name: inventario_id
            data_type: bigint
            data_tests:
              - not_null
          - name: deposito_id
            data_type: bigint
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze', 'depositos')
                    field: deposito_id
          - name: dt_contagem
            data_type: date
            data_tests:
              - not_null
          - name: status
            data_type: string
      - name: depositos
        description: Tabela de negócio depositos no domínio varejo.
        config:
          tags:
            - strata:estoque
        constraints:
          - type: primary_key
            columns:
              - deposito_id
            warn_unsupported: false
        columns:
          - name: deposito_id
            data_type: bigint
            data_tests:
              - not_null
          - name: nome
            data_type: string
            data_tests:
              - not_null
          - name: uf
            data_type: string
          - name: tipo
            data_type: string
      - name: unidades_medida
        description: Tabela de negócio unidades_medida no domínio varejo.
        config:
          tags:
            - strata:estoque
        constraints:
          - type: primary_key
            columns:
              - unidade_id
            warn_unsupported: false
        columns:
          - name: unidade_id
            data_type: bigint
            data_tests:
              - not_null
          - name: sigla
            data_type: string
            data_tests:
              - unique
              - not_null
          - name: nome
            data_type: string
            data_tests:
              - not_null
      - name: lotes
        description: Tabela de negócio lotes no domínio varejo.
        config:
          tags:
            - strata:estoque
        constraints:
          - type: primary_key
            columns:
              - lote_id
            warn_unsupported: false
        columns:
          - name: lote_id
            data_type: bigint
            data_tests:
              - not_null
          - name: produto_id
            data_type: bigint
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze', 'produtos')
                    field: produto_id
          - name: codigo
            data_type: string
            data_tests:
              - not_null
          - name: dt_validade
            data_type: date
      - name: transferencias
        description: Tabela de negócio transferencias no domínio varejo.
        config:
          tags:
            - strata:estoque
        constraints:
          - type: primary_key
            columns:
              - transf_id
            warn_unsupported: false
        columns:
          - name: transf_id
            data_type: bigint
            data_tests:
              - not_null
          - name: deposito_origem_id
            data_type: bigint
            data_tests:
              - not_null
          - name: deposito_destino_id
            data_type: bigint
            data_tests:
              - not_null
          - name: dt_transf
            data_type: timestamp
            data_tests:
              - not_null
      - name: perdas
        description: Tabela de negócio perdas no domínio varejo.
        config:
          tags:
            - strata:estoque
        constraints:
          - type: primary_key
            columns:
              - perda_id
            warn_unsupported: false
        columns:
          - name: perda_id
            data_type: bigint
            data_tests:
              - not_null
          - name: produto_id
            data_type: bigint
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze', 'produtos')
                    field: produto_id
          - name: quantidade
            data_type: decimal(18,3)
            data_tests:
              - not_null
          - name: motivo
            data_type: string
          - name: dt_perda
            data_type: date
            data_tests:
              - not_null
      - name: compras
        description: Tabela de negócio compras no domínio varejo.
        config:
          tags:
            - strata:estoque
        constraints:
          - type: primary_key
            columns:
              - compra_id
            warn_unsupported: false
        columns:
          - name: compra_id
            data_type: bigint
            data_tests:
              - not_null
          - name: fornecedor_id
            data_type: bigint
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze', 'fornecedores')
                    field: fornecedor_id
          - name: produto_id
            data_type: bigint
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze', 'produtos')
                    field: produto_id
          - name: quantidade
            data_type: decimal(18,3)
            data_tests:
              - not_null
          - name: vl_total
            data_type: decimal(18,2)
            data_tests:
              - not_null
          - name: dt_compra
            data_type: date
            data_tests:
              - not_null
