                  not_null: true
            data_tests:
              - unique
              - not_null
          - name: deposito_id
            data_type: bigint
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze_estoque', 'depositos')
                    field: deposito_id
          - name: dt_contagem
            data_type: date
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
          - name: status
            data_type: string
      - name: depositos
        description: Tabela de negócio depositos no domínio varejo.
