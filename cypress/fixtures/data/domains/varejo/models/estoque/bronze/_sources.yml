version: 2
sources:
  - name: bronze_estoque
    schema: bronze_estoque
    tables:
      - name: produtos
        description: Tabela de negócio produtos no domínio varejo.
        config:
          tags:
            - strata:estoque
          meta:
            strata:
              table_id: bronze.produtos
              layer: bronze
              schema: bronze_estoque
              pk:
                - produto_id
        columns:
          - name: produto_id
            data_type: bigint
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - unique
              - not_null
          - name: sku
            data_type: string
            config:
              meta:
                strata:
                  not_null: true
                  unique: true
            data_tests:
              - unique
              - not_null
          - name: nome
            data_type: string
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
          - name: categoria
            data_type: string
          - name: marca
            data_type: string
      - name: fornecedores
        description: Tabela de negócio fornecedores no domínio varejo.
        config:
          tags:
            - strata:estoque
          meta:
            strata:
              table_id: bronze.fornecedores
              layer: bronze
              schema: bronze_estoque
              pk:
                - fornecedor_id
        columns:
          - name: fornecedor_id
            data_type: bigint
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - unique
              - not_null
          - name: nome
            data_type: string
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
          - name: cnpj
            data_type: string
            config:
              meta:
                strata:
                  unique: true
            data_tests:
              - unique
      - name: movimentacoes
        description: Tabela de negócio movimentacoes no domínio varejo.
        config:
          tags:
            - strata:estoque
          meta:
            strata:
              table_id: bronze.movimentacoes
              layer: bronze
              schema: bronze_estoque
              pk:
                - mov_id
              indexes:
                - columns:
                    - produto_id
                    - dt_movimento
                  name: idx_mov_produto_dt
        columns:
          - name: mov_id
            data_type: bigint
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - unique
              - not_null
          - name: produto_id
            data_type: bigint
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze_estoque', 'produtos')
                    field: produto_id
          - name: deposito_id
            data_type: bigint
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze_estoque', 'depositos')
                    field: deposito_id
          - name: tipo
            data_type: string
            config:
              meta:
                strata:
                  enum: tipo_movimentacao
                  not_null: true
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - entrada
                      - saida
                      - ajuste
                      - transferencia
          - name: quantidade
            data_type: decimal(18,3)
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
          - name: dt_movimento
            data_type: timestamp
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
      - name: inventario
        description: Tabela de negócio inventario no domínio varejo.
        config:
          tags:
            - strata:estoque
          meta:
            strata:
