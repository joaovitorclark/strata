version: 2
models:
  - name: fct_consentimento
    description: Tabela de negócio fct_consentimento no domínio varejo.
    config:
      tags:
        - strata:managed
        - strata:clientes
      schema: gold
      contract:
        enforced: true
      meta:
        strata:
          managed: true
    constraints:
      - type: primary_key
        columns:
          - consentimento_id
        warn_unsupported: false
    columns:
      - name: consentimento_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: silver.consentimento.consentimento_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: cliente_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: silver.consentimento.cliente_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: finalidade
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: silver.consentimento.finalidade
      - name: aceito
        data_type: boolean
        config:
          meta:
            strata:
              lineage:
                - from: silver.consentimento.aceito
