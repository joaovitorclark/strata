version: 2
models:
  - name: fct_app_evento
    description: Tabela de negócio fct_app_evento no domínio varejo.
    config:
      tags:
        - strata:clientes
      schema: gold
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - evento_id
        warn_unsupported: false
    columns:
      - name: evento_id
        data_type: bigint
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: cliente_id
        data_type: bigint
      - name: nome_evento
        data_type: string
