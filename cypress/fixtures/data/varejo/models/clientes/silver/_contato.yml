version: 2
models:
  - name: contato
    config:
      tags:
        - strata:managed
        - strata:clientes
      schema: silver
      contract:
        enforced: true
      meta:
        strata:
          managed: true
    constraints:
      - type: primary_key
        columns:
          - contato_id
        warn_unsupported: false
    columns:
      - name: contato_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.contatos.contato_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: cliente_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.contatos.cliente_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: tipo
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.contatos.tipo
      - name: valor
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.contatos.valor
        constraints:
          - type: not_null
            warn_unsupported: false
