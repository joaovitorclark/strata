version: 2
sources:
  - name: bronze_vendas
    schema: bronze_vendas
    tables:
      - name: pedidos
        description: Tabela de negócio pedidos no domínio varejo.
        config:
          tags:
            - strata:vendas
          meta:
            strata:
              table_id: bronze.pedidos
              layer: bronze
              schema: bronze_vendas
              pk:
                - pedido_id
              indexes:
                - columns:
                    - cliente_id
                    - dt_emissao
                  name: idx_pedidos_cliente_dt
        columns:
          - name: pedido_id
            data_type: bigint
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - unique
              - not_null
          - name: cliente_id
            data_type: bigint
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze_vendas', 'clientes_venda')
                    field: cliente_id
          - name: canal_id
            data_type: bigint
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze_vendas', 'canais')
                    field: canal_id
          - name: loja_id
            data_type: bigint
            data_tests:
              - relationships:
                  arguments:
                    to: source('bronze_vendas', 'lojas')
                    field: loja_id
          - name: vendedor_id
            data_type: bigint
            data_tests:
              - relationships:
                  arguments:
                    to: source('bronze_vendas', 'vendedores')
                    field: vendedor_id
          - name: cupom_id
            data_type: bigint
            data_tests:
              - relationships:
                  arguments:
                    to: source('bronze_vendas', 'cupons')
                    field: cupom_id
          - name: vl_total
            data_type: decimal(18,2)
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
          - name: vl_desconto
            data_type: decimal(18,2)
          - name: vl_frete
            data_type: decimal(18,2)
          - name: status
            data_type: string
            config:
              meta:
                strata:
                  enum: status_pedido
                  not_null: true
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - pendente
                      - pago
                      - enviado
                      - entregue
                      - cancelado
          - name: dt_emissao
            data_type: timestamp
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
          - name: dt_carga
            data_type: timestamp
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
      - name: itens_pedido
        description: Tabela de negócio itens_pedido no domínio varejo.
        config:
          tags:
            - strata:vendas
          meta:
            strata:
              table_id: bronze.itens_pedido
              layer: bronze
              schema: bronze_vendas
              pk:
                - pedido_id
                - item_seq
        columns:
          - name: pedido_id
            data_type: bigint
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze_vendas', 'pedidos')
                    field: pedido_id
          - name: item_seq
            data_type: int
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
          - name: produto_id
            data_type: bigint
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze_vendas', 'produtos_venda')
                    field: produto_id
          - name: qtd
            data_type: decimal(18,3)
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
          - name: vl_unitario
            data_type: decimal(18,2)
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
          - name: vl_total
            data_type: decimal(18,2)
            config:
              meta:
                strata:
                  not_null: true
            data_tests:
              - not_null
      - name: pagamentos
        description: Tabela de negócio pagamentos no domínio varejo.
