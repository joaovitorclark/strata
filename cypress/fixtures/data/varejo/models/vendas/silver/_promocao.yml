version: 2
models:
  - name: promocao
    config:
      tags:
        - strata:managed
        - strata:vendas
      schema: silver
      contract:
        enforced: true
      meta:
        strata:
          managed: true
    constraints:
      - type: primary_key
        columns:
          - promocao_id
        warn_unsupported: false
    columns:
      - name: promocao_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.promocoes.promocao_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: nome
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.promocoes.nome
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: dt_inicio
        data_type: date
        config:
          meta:
            strata:
              lineage:
                - from: bronze.promocoes.dt_inicio
      - name: dt_fim
        data_type: date
        config:
          meta:
            strata:
              lineage:
                - from: bronze.promocoes.dt_fim
      - name: perc_desconto
        data_type: decimal(5,2)
        config:
          meta:
            strata:
              lineage:
                - from: bronze.promocoes.perc_desconto
