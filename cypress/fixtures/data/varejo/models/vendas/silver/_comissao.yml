version: 2
models:
  - name: comissao
    config:
      tags:
        - strata:vendas
      schema: silver
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - vendedor_id
          - pedido_id
        warn_unsupported: false
    columns:
      - name: vendedor_id
        data_type: bigint
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: pedido_id
        data_type: bigint
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: vl_comissao
        data_type: decimal(18,2)
