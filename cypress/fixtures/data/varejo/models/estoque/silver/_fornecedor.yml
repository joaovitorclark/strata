version: 2
models:
  - name: fornecedor
    config:
      tags:
        - strata:managed
        - strata:estoque
      schema: silver
      contract:
        enforced: true
      meta:
        strata:
          managed: true
    constraints:
      - type: primary_key
        columns:
          - fornecedor_id
        warn_unsupported: false
      - type: unique
        columns:
          - cnpj
        warn_unsupported: false
    columns:
      - name: fornecedor_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.fornecedores.fornecedor_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: nome
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.fornecedores.nome
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: cnpj
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.fornecedores.cnpj
