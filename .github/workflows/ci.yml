name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - research/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm run e2e:serve
          wait-on: http://localhost:5174
          command: npm run cy:run
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore

  stress:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm run e2e:serve
          wait-on: http://localhost:5174
          command: npm run cy:run:stress
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-stress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
