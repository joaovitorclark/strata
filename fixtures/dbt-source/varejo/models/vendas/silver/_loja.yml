version: 2
models:
  - name: loja
    config:
      tags:
        - strata:managed
        - strata:vendas
      schema: silver
      contract:
        enforced: true
      meta:
        strata:
          managed: true
    constraints:
      - type: primary_key
        columns:
          - loja_id
        warn_unsupported: false
    columns:
      - name: loja_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.lojas.loja_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: nome
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.lojas.nome
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: uf
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.lojas.uf
      - name: cidade
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.lojas.cidade
