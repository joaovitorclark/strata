version: 2
models:
  - name: fct_estoque
    description: Tabela de negócio fct_estoque no domínio varejo.
    config:
      tags:
        - strata:managed
        - strata:estoque
      meta:
        strata:
          managed: true
          transform:
            from:
              ref: movimentacao
              alias: s0
            joins: []
            where: ""
            group_by: []
      schema: gold
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - produto_id
          - deposito_id
        warn_unsupported: false
      - type: foreign_key
        columns:
          - produto_id
        to: ref('dim_produto')
        to_columns:
          - produto_id
        warn_unsupported: false
      - type: foreign_key
        columns:
          - deposito_id
        to: ref('dim_deposito')
        to_columns:
          - deposito_id
        warn_unsupported: false
    columns:
      - name: produto_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: silver.movimentacao.produto_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: deposito_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: silver.movimentacao.deposito_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: quantidade
        data_type: decimal(18,3)
        config:
          meta:
            strata:
              lineage:
                - from: silver.movimentacao.quantidade
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: dt_movimento
        data_type: timestamp
        config:
          meta:
            strata:
              lineage:
                - from: silver.movimentacao.dt_movimento
