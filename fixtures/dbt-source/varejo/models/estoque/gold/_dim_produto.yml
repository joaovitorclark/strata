version: 2
models:
  - name: dim_produto
    description: Tabela de negócio dim_produto no domínio varejo.
    config:
      tags:
        - strata:managed
        - strata:estoque
      schema: gold
      contract:
        enforced: true
      meta:
        strata:
          managed: true
    constraints:
      - type: primary_key
        columns:
          - produto_id
        warn_unsupported: false
    columns:
      - name: produto_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: silver.produto.produto_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: sku
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: silver.produto.sku
      - name: nome
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: silver.produto.nome
      - name: categoria
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: silver.produto.categoria
