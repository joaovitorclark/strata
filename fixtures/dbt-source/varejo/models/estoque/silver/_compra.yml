version: 2
models:
  - name: compra
    config:
      tags:
        - strata:managed
        - strata:estoque
      schema: silver
      contract:
        enforced: true
      meta:
        strata:
          managed: true
    constraints:
      - type: primary_key
        columns:
          - compra_id
        warn_unsupported: false
    columns:
      - name: compra_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.compras.compra_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: fornecedor_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.compras.fornecedor_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: produto_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.compras.produto_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: quantidade
        data_type: decimal(18,3)
        config:
          meta:
            strata:
              lineage:
                - from: bronze.compras.quantidade
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: vl_total
        data_type: decimal(18,2)
        config:
          meta:
            strata:
              lineage:
                - from: bronze.compras.vl_total
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: dt_compra
        data_type: date
        config:
          meta:
            strata:
              lineage:
                - from: bronze.compras.dt_compra
        constraints:
          - type: not_null
            warn_unsupported: false
