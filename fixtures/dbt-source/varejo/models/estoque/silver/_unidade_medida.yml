version: 2
models:
  - name: unidade_medida
    config:
      tags:
        - strata:managed
        - strata:estoque
      schema: silver
      contract:
        enforced: true
      meta:
        strata:
          managed: true
    constraints:
      - type: primary_key
        columns:
          - unidade_id
        warn_unsupported: false
      - type: unique
        columns:
          - sigla
        warn_unsupported: false
    columns:
      - name: unidade_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.unidades_medida.unidade_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: sigla
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.unidades_medida.sigla
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: nome
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.unidades_medida.nome
        constraints:
          - type: not_null
            warn_unsupported: false
