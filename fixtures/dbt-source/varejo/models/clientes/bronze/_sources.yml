version: 2
sources:
  - name: bronze_clientes
    schema: bronze
    tables:
      - name: cadastro
        description: Tabela de negócio cadastro no domínio varejo.
        config:
          tags:
            - strata:clientes
        constraints:
          - type: primary_key
            columns:
              - cliente_id
            warn_unsupported: false
        columns:
          - name: cliente_id
            data_type: bigint
            data_tests:
              - not_null
