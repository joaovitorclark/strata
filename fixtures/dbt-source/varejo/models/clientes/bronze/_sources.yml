            data_type: bigint
            data_tests:
              - not_null
          - name: cliente_id
            data_type: bigint
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('bronze_clientes', 'cadastro')
                    field: cliente_id
          - name: tipo
            data_type: string
          - name: logradouro
            data_type: string
