version: 2
models:
  - name: endereco
    config:
      tags:
        - strata:managed
        - strata:clientes
      meta:
        strata:
          table_id: silver.endereco
          layer: silver
          schema: silver
          pk:
            - endereco_id
          managed: true
          transform:
            from:
              source:
                - bronze_clientes
                - enderecos
              alias: s0
            joins: []
            where: ""
            group_by: []
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - endereco_id
        warn_unsupported: false
    columns:
      - name: endereco_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.enderecos.endereco_id
              not_null: true
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: cliente_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: bronze.enderecos.cliente_id
              not_null: true
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: tipo
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.enderecos.tipo
      - name: logradouro
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.enderecos.logradouro
      - name: cidade
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.enderecos.cidade
      - name: uf
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.enderecos.uf
      - name: cep
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: bronze.enderecos.cep
