version: 2
models:
  - name: lgpd_cliente
    config:
      tags:
        - strata:clientes
      meta:
        strata:
          table_id: silver.lgpd_cliente
          layer: silver
          schema: silver
          pk:
            - cliente_id
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - cliente_id
        warn_unsupported: false
    columns:
      - name: cliente_id
        data_type: bigint
        config:
          meta:
            strata:
              not_null: true
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: finalidade
        data_type: string
      - name: aceito
        data_type: boolean
