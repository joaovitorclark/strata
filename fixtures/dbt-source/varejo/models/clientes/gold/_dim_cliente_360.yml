version: 2
models:
  - name: dim_cliente_360
    description: Tabela de negócio dim_cliente_360 no domínio varejo.
    config:
      tags:
        - strata:managed
        - strata:clientes
      schema: gold
      contract:
        enforced: true
      meta:
        strata:
          managed: true
    constraints:
      - type: primary_key
        columns:
          - cliente_id
        warn_unsupported: false
      - type: foreign_key
        columns:
          - cliente_id
        to: ref('dim_cliente')
        to_columns:
          - cliente_id
        warn_unsupported: false
    columns:
      - name: cliente_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: gold.dim_cliente.cliente_id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: nome
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: gold.dim_cliente.nome
      - name: email
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: gold.dim_cliente.email
      - name: receita_total
        data_type: decimal(18,2)
        config:
          meta:
            strata:
              lineage:
                - from: gold.fct_vendas.receita_bruta
      - name: status
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: gold.dim_cliente.status
