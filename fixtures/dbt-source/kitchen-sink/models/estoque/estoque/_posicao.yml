version: 2
models:
  - name: posicao
    config:
      tags:
        - strata:estoque
      schema: estoque
      materialized: table
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - id
        warn_unsupported: false
      - type: foreign_key
        columns:
          - pedido_id
        to: ref('fato_pedido')
        to_columns:
          - id
        warn_unsupported: false
    columns:
      - name: id
        data_type: bigint
      - name: pedido_id
        data_type: bigint
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: quantidade
        data_type: int
        constraints:
          - type: not_null
            warn_unsupported: false
