version: 2
models:
  - name: fato_pedido
    config:
      tags:
        - strata:vendas
      meta:
        strata:
          table_id: gold.fato_pedido
          layer: gold
          schema: gold
          pk:
            - id
      materialized: table
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - id
        warn_unsupported: false
      - type: foreign_key
        columns:
          - cliente_id
        to: ref('dim_cliente')
        to_columns:
          - id
        warn_unsupported: false
    columns:
      - name: id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: silver.stg_pedido.id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: cliente_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: silver.stg_pedido.cliente_id
              not_null: true
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: total
        data_type: decimal(18,2)
        config:
          meta:
            strata:
              lineage:
                - from: silver.stg_pedido.total
