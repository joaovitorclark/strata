        columns:
          - pedido_id
        to: ref('stg_pedido')
        to_columns:
          - id
        warn_unsupported: false
    columns:
      - name: pedido_id
        data_type: bigint
        config:
          meta:
            strata:
              not_null: true
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: seq
        data_type: int
        config:
          meta:
            strata:
              not_null: true
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: sku
        data_type: string
        config:
          meta:
            strata:
              not_null: true
        constraints:
          - type: not_null
            warn_unsupported: false
