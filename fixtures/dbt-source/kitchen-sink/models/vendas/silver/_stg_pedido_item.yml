version: 2
models:
  - name: stg_pedido_item
    config:
      tags:
        - strata:vendas
      meta:
        strata:
          table_id: silver.stg_pedido_item
          layer: silver
          schema: silver
          pk:
            - pedido_id
            - seq
      materialized: view
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - pedido_id
          - seq
        warn_unsupported: false
