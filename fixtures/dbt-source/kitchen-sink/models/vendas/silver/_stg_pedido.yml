version: 2
models:
  - name: stg_pedido
    config:
      tags:
        - strata:vendas
      schema: silver
      materialized: view
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - id
        warn_unsupported: false
      - type: foreign_key
        columns:
          - cliente_id
        to: ref('stg_cliente')
        to_columns:
          - id
        warn_unsupported: false
    columns:
      - name: id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: raw.pedido.id
      - name: cliente_id
        data_type: bigint
        config:
          meta:
            strata:
              lineage:
                - from: raw.pedido.cliente_id
              rolename: silver.stg_cliente.id
        constraints:
          - type: not_null
            warn_unsupported: false
      - name: total
        data_type: decimal(18,2)
        config:
          meta:
            strata:
              lineage:
                - from: raw.pedido.total
      - name: descrição
        data_type: string
        config:
          meta:
            strata:
              lineage:
                - from: raw.pedido.descrição
