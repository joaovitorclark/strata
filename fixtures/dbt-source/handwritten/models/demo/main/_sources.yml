# keep-me: sources header
version: 2
sources:
  - name: raw
    schema: raw
    tables:
      - name: events
        description: raw events
        config:
          tags:
            - strata:demo
        constraints:
          - type: primary_key
            columns: [id]
            warn_unsupported: false
        columns:
          - name: id
            data_type: bigint
          - name: widget_id
            data_type: bigint
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: ref('widget')
                    field: id
