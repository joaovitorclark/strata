# keep-me: file header comment — must survive edits
version: 2
x-status: &status_col
  data_type: string
  description: anchored status
models:
  - name: widget
    description: handwritten widget
    columns:
      - name: zed
        data_type: string
        description: last alphabetically, listed first
      - name: id
        data_type: bigint
      - name: status
        <<: *status_col
        data_tests:
          - accepted_values:
              arguments:
                values: [on, off]
          - custom_test_widget
    config:
      snowflake_warehouse: analytics_wh
      tags:
        - strata:demo
      materialized: table
      contract:
        enforced: true
      meta:
        strata:
          managed: true
          indexes:
            - columns: [id]
              name: idx_widget
    constraints:
      - type: primary_key
        columns: [id]
        warn_unsupported: false
